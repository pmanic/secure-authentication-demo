spring.application.name=web-security-lab
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/web-security-lab;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.sql.init.mode=always
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
app.cors.allowed-origin=${ALLOWED_ORIGIN:http://localhost:5500}
server.error.include-message=never
server.error.include-stacktrace=never
